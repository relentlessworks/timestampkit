name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy docs to gh-pages branch
        run: |
          git config user.name "Relentless"
          git config user.email "noreply@relentlessworks.com"

          # Save docs to temp dir
          cp -r docs /tmp/docs-backup

          # Checkout orphan gh-pages branch
          git checkout --orphan gh-pages
          git reset --hard

          # Clean everything
          git clean -fdx

          # Copy docs back
          cp -r /tmp/docs-backup/* .

          # Remove non-docs files
          rm -f Makefile go.mod go.sum VERSION
          rm -rf cmd internal .github

          # Add and commit
          git add -A
          git commit -m "Deploy docs to gh-pages"

          # Force push
          git push origin gh-pages --force
